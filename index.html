<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unidades de Medida en CSS</title>
    <style>
        h1 { font-size: 0..5in;
        color:orange;
        text-align: center;
        text-transform:uppercase;
        text-shadow: 3px 3px 5px black;
    }
        #caja {
            width: 100vw;
            height:100vh;
            background-color: aqua;
            
        }
        p { font-size: 1.5em;
        text-align: justify;
        letter-spacing: 5px;
        line-height: 2;
        }
        #titulo {
            box-shadow: 3px 3px 3px black;
            width: 50%;
            background-color: yellow;
        }
        a {
            text-decoration: none;
        }
    </style>
</head>
<body>
    <a href="http://www.iesjuanbosco.es">IES Juan Bosco</a>
    <div id="caja">
        <div id="titulo">
            Esto es una subcaja
        </div>
        <h1>Unidades de medida en CSS</h1>
        <p>A diferencia de HTML que solo acepta pixeles,
            en CCS se puede indicar el tamaño de los elementos con distintas unidades. Por ejemplo: centimetros, milímetros, puntos, pixeles
        </p>
    </div>
</body>
</html>
